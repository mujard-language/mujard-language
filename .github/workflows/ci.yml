name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        module: [tools/mujard, tools/mujard-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)"

      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: test
        working-directory: ${{ matrix.module }}
        run: go test ./...
